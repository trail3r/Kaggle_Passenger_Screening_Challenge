[project]
name = "passenger-screening-research"
version = "0.1.0"
description = "Multi-view threat detection research using TSA passenger screening data"
readme = "README.md"
authors = [
    { name = "trail3r", email = "gusdnr7223@gmail.com" }
]
requires-python = "==3.12.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0",
    "pillow>=12.0",
    "scikit-learn>=1.9",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics>=8.4.125",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
]

[tool.black]
line-length = 120
target-version = ["py312"]
